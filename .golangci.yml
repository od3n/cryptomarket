version: "2"
run:
  modules-download-mode: readonly
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nestif
    - noctx
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
      config:
        G306: "0644"
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: cmd/
      - linters:
          - gosec
        path: cmd/mockprovider/
        text: G404
      - linters:
          - funlen
          - gocognit
          - gocyclo
        path: _test\.go
      - path: _test\.go
        text: Error return value of .*.Close is not checked
      - linters:
          - revive
        path: migrations/
    paths:
      - frontend/node_modules
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
severity:
  default: error
  rules:
    - linters:
        - misspell
        - prealloc
        - unconvert
      severity: warning
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/crypto-market-platform
  exclusions:
    generated: lax
    paths:
      - frontend/node_modules
      - third_party$
      - builtin$
      - examples$
