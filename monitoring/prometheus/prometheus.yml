global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files for recording rules and alerts.
# Paths are relative to this config file so promtool validation works
# from the repo checkout and in the container image alike.
rule_files:
  - recording-rules.yml
  - alerts.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "market-api"
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: "realtime-gateway"
    static_configs:
      - targets: ["realtime:8081"]
    metrics_path: /metrics

  - job_name: "market-ingestor"
    static_configs:
      - targets: ["ingestor:8082"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
