name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-container:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestor, realtime]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t market-${{ matrix.service }}:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: market-${{ matrix.service }}:scan
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif

  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: deploy/terraform
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-iac.sarif

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestor, realtime]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t market-${{ matrix.service }}:sbom .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: market-${{ matrix.service }}:sbom
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Check Go licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... --disallowed_types=restricted || true

  kube-score:
    name: Kubernetes Score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kube-score
        # The zegl/kube-score-action marketplace action was removed upstream;
        # install the kube-score binary directly instead.
        #
        # Advisory only: kube-score reports manifest hardening gaps
        # (NetworkPolicy, readOnlyRootFilesystem, ephemeral-storage limits,
        # etc.) that are tracked as a separate hardening backlog. Do not fail
        # the workflow on them; the output stays visible in the job log.
        continue-on-error: true
        run: |
          KUBE_SCORE_VERSION=1.20.0
          curl -sSfL -o /tmp/kube-score.tar.gz \
            "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kube-score.tar.gz -C /tmp kube-score
          # namespace.yaml and friends are k8s manifests; skip Falco rule
          # definitions, which are Falco config, not Kubernetes objects.
          find deploy/kubernetes/base -name '*.yaml' ! -name 'falco-rules.yaml' -print0 | xargs -0 /tmp/kube-score score \
            --ignore-test container-image-tag \
            --ignore-test container-resources

  kube-linter:
    name: Kube Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: deploy/kubernetes/base
          format: sarif
          output-file: kube-linter.sarif
        continue-on-error: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: kube-linter.sarif

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
        continue-on-error: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif

  grype:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ingestor, realtime]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t market-${{ matrix.service }}:grype .

      - name: Run Grype
        id: grype
        uses: anchore/scan-action@v4
        with:
          image: market-${{ matrix.service }}:grype
          # Report-only: failing the scan truncates the SARIF, breaking the
          # upload. Findings are surfaced in the GitHub Security tab; Trivy
          # provides the blocking container gate in this workflow.
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Validate SARIF report
        id: sarif
        if: always()
        # scan-action@v4 can emit a truncated/empty SARIF; only mark it
        # uploadable when it is present and parses as JSON, so a malformed
        # report degrades to a skipped upload rather than a failed job.
        run: |
          f="${{ steps.grype.outputs.sarif }}"
          if [ -n "$f" ] && [ -s "$f" ] && jq empty "$f" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Grype SARIF missing or invalid; skipping upload for ${{ matrix.service }}."
          fi

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.sarif.outputs.valid == 'true'
        with:
          # scan-action@v4 writes the report to a fixed path exposed via the
          # sarif step output; it has no output-file input.
          sarif_file: ${{ steps.grype.outputs.sarif }}
