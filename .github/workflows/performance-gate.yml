name: Performance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "internal/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/performance-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      HTTP_PORT: "8080"
      POSTGRES_USER: cryptouser
      POSTGRES_PASSWORD: cryptopass
      POSTGRES_DB: cryptomarket
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_ADDRESS: 127.0.0.1:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptouser -d cryptomarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Configure application test environment
        run: |
          echo "POSTGRES_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build API binary
        run: CGO_ENABLED=0 go build -o bin/api ./cmd/api

      - name: Run database migrations
        run: ./bin/api migrate

      - name: Start API
        run: |
          ./bin/api > api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

          for _ in {1..15}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done

          cat api.log
          exit 1

      - name: Set up k6
        uses: grafana/setup-k6-action@v1.2.1

      - name: Run benchmark
        run: |
          k6 run --quiet --summary-export=benchmark-current.json \
            --env API_URL=http://127.0.0.1:8080 \
            --env LEVEL=1 \
            load-tests/benchmark.js


      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.API_PID }} 2>/dev/null || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark-current.json
          if-no-files-found: ignore
