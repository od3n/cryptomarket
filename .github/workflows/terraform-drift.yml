name: Terraform Drift Detection

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to check (all, dev, staging, prod)"
        required: false
        default: "all"
        type: choice
        options: [all, dev, staging, prod]

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: us-east-1

jobs:
  drift-detection:
    name: Drift Check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event.inputs.environment == 'all' && fromJson('["dev","staging","prod"]') || fromJson(format('["{0}"]', github.event.inputs.environment || 'all')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: deploy/terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan (drift check)
        id: plan
        working-directory: deploy/terraform/environments/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift_output.txt
          EXIT_CODE=$?
          echo "exitcode=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No drift detected in ${{ matrix.environment }}"
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ Drift detected in ${{ matrix.environment }}!"
          else
            echo "drift_detected=error" >> $GITHUB_OUTPUT
            echo "❌ Terraform plan failed in ${{ matrix.environment }}"
            exit 1
          fi

      - name: Extract drift summary
        if: steps.plan.outputs.drift_detected == 'true'
        id: summary
        working-directory: deploy/terraform/environments/${{ matrix.environment }}
        run: |
          # Extract the plan summary line
          SUMMARY=$(grep -E "Plan:|No changes" drift_output.txt | tail -1)
          echo "summary=${SUMMARY:-Unknown changes detected}" >> $GITHUB_OUTPUT

          # Extract changed resources
          CHANGES=$(grep -E "^\s+#\s" drift_output.txt | head -20)
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create/Update Drift Issue
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🔄 Terraform Drift Detected: ${{ matrix.environment }}`;
            const body = `## Terraform Configuration Drift

            **Environment**: \`${{ matrix.environment }}\`
            **Detected**: ${new Date().toISOString()}
            **Summary**: ${{ steps.summary.outputs.summary }}

            ### Changed Resources

            \`\`\`
            ${{ steps.summary.outputs.changes }}
            \`\`\`

            ### Action Required

            1. Review the changes: \`cd deploy/terraform/environments/${{ matrix.environment }} && terraform plan\`
            2. Determine if changes are intentional (manual edits) or accidental
            3. If unintentional: \`terraform apply\` to reconcile
            4. If intentional: update Terraform code to match reality

            ---
            *Auto-generated by drift detection workflow*`;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift',
              state: 'open'
            });

            const existing = issues.data.find(i => i.title.includes('${{ matrix.environment }}'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Drift still present as of ${new Date().toISOString()}\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['terraform-drift', 'P2']
              });
            }

      - name: Close resolved drift issues
        if: steps.plan.outputs.drift_detected == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift',
              state: 'open'
            });

            const resolved = issues.data.find(i =>
              i.title.includes('${{ matrix.environment }}')
            );

            if (resolved) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: resolved.number,
                body: `✅ Drift resolved as of ${new Date().toISOString()}. No differences detected.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: resolved.number,
                state: 'closed'
              });
            }
