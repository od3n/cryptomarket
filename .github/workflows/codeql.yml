name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: go
          queries: security-and-quality

      - name: Build
        run: |
          # Build to /dev/null: the repo has an api/ directory, so a bare
          # 'go build ./cmd/api' collides with it when writing the binary.
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/ingestor
          CGO_ENABLED=0 go build -o /dev/null ./cmd/realtime

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:go"

  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          source-root: frontend

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:javascript-typescript"

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: python
          queries: security-and-quality
          source-root: sre-toolkit

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:python"
