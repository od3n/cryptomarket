apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-api-config
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
data:
  APP_ENV: "production"
  SERVICE_NAME: "market-api"
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"
  REDIS_DB: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: market-api-secrets
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
type: Opaque
stringData:
  POSTGRES_DSN: "postgres://cryptouser:cryptopass@postgres:5432/cryptomarket?sslmode=require"
  REDIS_ADDRESS: "redis:6379"
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-api
        app.kubernetes.io/part-of: cryptomarket
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: market-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: market-api
          image: market-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: market-api-config
            - secretRef:
                name: market-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-api
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-api
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-api
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
