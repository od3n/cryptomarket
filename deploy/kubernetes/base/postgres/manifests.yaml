apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: database
data:
  POSTGRES_USER: "cryptouser"
  POSTGRES_DB: "cryptomarket"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_PASSWORD: "cryptopass"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: cryptomarket
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cryptouser
                - -d
                - cryptomarket
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cryptouser
                - -d
                - cryptomarket
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-api
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-ingestor
      ports:
        - protocol: TCP
          port: 5432
