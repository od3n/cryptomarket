# ArgoCD Application Manifests for GitOps Deployment
# Apply these to the ArgoCD namespace to enable GitOps-driven deployments.
# Prerequisites: ArgoCD installed in the cluster (argocd namespace)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cryptomarket-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/crypto-market-platform/cryptomarket.git
    targetRevision: main
    path: deploy/helm/cryptomarket
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: global.imageRegistry
          value: ""  # Set via ArgoCD UI or CI override
  destination:
    server: https://kubernetes.default.svc
    namespace: cryptomarket-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cryptomarket-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/crypto-market-platform/cryptomarket.git
    targetRevision: main
    path: deploy/helm/cryptomarket
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cryptomarket-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
# OPA Gatekeeper policies (synced via GitOps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opa-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/crypto-market-platform/cryptomarket.git
    targetRevision: main
    path: deploy/kubernetes/base/opa
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
