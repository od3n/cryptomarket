kind: Service
metadata:
  name: alertmanager
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
