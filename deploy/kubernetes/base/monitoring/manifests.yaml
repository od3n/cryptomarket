apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: cryptomarket
        app.kubernetes.io/component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  admin-password: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
    - port: 3000
      targetPort: http
      name: http
