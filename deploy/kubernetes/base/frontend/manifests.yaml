apiVersion: v1
kind: ServiceAccount
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-frontend-config
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  API_URL: "http://market-api:80"
  REALTIME_URL: "http://realtime-gateway:80"
  NEXT_PUBLIC_FRESH_THRESHOLD: "120"
  NEXT_PUBLIC_STALE_THRESHOLD: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: market-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-frontend
        app.kubernetes.io/part-of: cryptomarket
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: market-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: market-frontend
          image: market-frontend:latest
          ports:
            - containerPort: 3000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: market-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-frontend
      app.kubernetes.io/component: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: market-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-frontend
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: market-frontend
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-frontend
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-api
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: realtime-gateway
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
