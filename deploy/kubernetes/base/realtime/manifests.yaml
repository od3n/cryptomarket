apiVersion: v1
kind: ServiceAccount
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-gateway-config
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
data:
  APP_ENV: "production"
  SERVICE_NAME: "realtime-gateway"
  HTTP_PORT: "8081"
  LOG_LEVEL: "info"
  REDIS_DB: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: realtime-gateway-secrets
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
type: Opaque
stringData:
  REDIS_ADDRESS: "redis:6379"
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
      app.kubernetes.io/component: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime-gateway
        app.kubernetes.io/part-of: cryptomarket
        app.kubernetes.io/component: realtime
    spec:
      serviceAccountName: realtime-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realtime-gateway
          image: realtime-gateway:latest
          ports:
            - containerPort: 8081
              protocol: TCP
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: realtime-gateway-config
            - secretRef:
                name: realtime-gateway-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/component: realtime
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
      app.kubernetes.io/component: realtime
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: realtime-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realtime-gateway
  namespace: cryptomarket
  labels:
    app.kubernetes.io/name: realtime-gateway
    app.kubernetes.io/part-of: cryptomarket
    app.kubernetes.io/component: realtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
      app.kubernetes.io/component: realtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
