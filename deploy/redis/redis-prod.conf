# Redis Production Configuration — Optimized for Crypto Market Platform
# Deploy as ConfigMap or use with ElastiCache parameter group.
#
# Key optimizations:
# - maxmemory-policy: allkeys-lru (evict least recently used when full)
# - Pipeline-friendly: tcp_nodelay disabled for batch throughput
# - Persistence: AOF with everysec fsync (balance durability/performance)
# - Connection pooling: tuned for go-redis default pool size

# ─── Memory Management ────────────────────────────────────────────────────────

# Maximum memory: size based on instance (adjust per environment)
# dev: 256mb, staging: 1gb, prod: 4gb
maxmemory 4gb

# Eviction policy: evict least recently used keys when maxmemory reached
# Our cache uses 5min TTL, so LRU is safe — stale data gets evicted first
maxmemory-policy allkeys-lru

# Sample size for LRU approximation (higher = more accurate, more CPU)
maxmemory-samples 10

# ─── Persistence ──────────────────────────────────────────────────────────────

# AOF persistence: balance between durability and performance
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots: backup every 5 min if at least 100 keys changed
save 300 100
save 60 10000

# Compress RDB files
rdbcompression yes
rdbchecksum yes

# ─── Network ──────────────────────────────────────────────────────────────────

# TCP settings optimized for pipelining
tcp-backlog 511
tcp-keepalive 300

# Disable Nagle's algorithm for lower latency on small responses
# (go-redis pipelines benefit from this)
# Note: ElastiCache uses tcp-nodelay yes by default

# Connection timeout (0 = no timeout, managed by client pool)
timeout 0

# ─── Client Connections ───────────────────────────────────────────────────────

# Max clients: sized for (API pods × pool_size) + (Realtime pods × pool_size) + headroom
# Production: (20 × 25) + (15 × 10) + 50 = 700
maxclients 1000

# ─── Streams Optimization ─────────────────────────────────────────────────────

# Stream node size: entries per radix tree node
# Larger = less memory overhead, slightly slower individual reads
stream-node-max-bytes 4096
stream-node-max-entries 100

# ─── Lazy Freeing ─────────────────────────────────────────────────────────────

# Use background threads for large key deletion (non-blocking)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes

# ─── Performance ──────────────────────────────────────────────────────────────

# IO threads for multi-threaded I/O (Redis 6+)
# Set to number of CPU cores / 2 (adjust per instance)
# io-threads 4
# io-threads-do-reads yes

# Disable slow log for sub-millisecond operations
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Security ─────────────────────────────────────────────────────────────────

# Require authentication (set via environment variable in production)
# requirepass ${REDIS_PASSWORD}

# Disable dangerous commands in production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# ─── Monitoring ───────────────────────────────────────────────────────────────

# Enable keyspace notifications for monitoring (minimal overhead)
notify-keyspace-events Ex

# Client output buffer limits (prevent slow consumers from consuming memory)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
