{{- if .Values.api.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-api-config
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-api" "component" "api") | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.ingestor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-ingestor-config
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-ingestor" "component" "ingestor") | nindent 4 }}
data:
  {{- range $key, $value := .Values.ingestor.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.realtime.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-gateway-config
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "realtime-gateway" "component" "realtime") | nindent 4 }}
data:
  {{- range $key, $value := .Values.realtime.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-frontend-config
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-frontend" "component" "frontend") | nindent 4 }}
data:
  {{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
