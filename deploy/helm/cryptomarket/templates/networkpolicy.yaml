{{- if .Values.networkPolicy.enabled }}
{{- if .Values.api.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-api
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-api" "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
{{- if .Values.ingestor.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-ingestor
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-ingestor" "component" "ingestor") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-ingestor
      app.kubernetes.io/component: ingestor
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
{{- if .Values.realtime.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: realtime-gateway
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "realtime-gateway" "component" "realtime") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
      app.kubernetes.io/component: realtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-frontend
  namespace: {{ include "cryptomarket.namespace" . }}
  labels:
    {{- include "cryptomarket.componentLabels" (dict "root" . "name" "market-frontend" "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-frontend
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
