prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.51.0
  retention: 15d
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.0"
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: v0.27.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "2.9.4"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.4.1"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
